        function initSortableList(container, itemSelector, onOrderUpdated) {
            let draggedItem = null;

            container.querySelectorAll(itemSelector).forEach(item => {
                const handle = item.querySelector('.drag-handle');
                if (!handle) return;

                handle.addEventListener('mousedown', () => {
                    draggedItem = item;
                    item.setAttribute('draggable', 'true');
                });

                handle.addEventListener('mouseup', () => {
                    item.removeAttribute('draggable');
                    draggedItem = null;
                });

                item.addEventListener('dragstart', (e) => {
                    if (!draggedItem) {
                        e.preventDefault();
                        return;
                    }
                    setTimeout(() => item.classList.add('dragging'), 0);
                });

                item.addEventListener('dragend', () => {
                    if (draggedItem) {
                        draggedItem.classList.remove('dragging');
                        draggedItem.removeAttribute('draggable');
                        draggedItem = null;
                        if (onOrderUpdated) onOrderUpdated();
                    }
                });

                handle.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    draggedItem = item;
                    item.classList.add('dragging');
                }, { passive: true });

                handle.addEventListener('touchmove', (e) => {
                    if (!draggedItem) return;
                    e.preventDefault();
                    const touchY = e.touches[0].clientY;
                    
                    const containerRect = container.getBoundingClientRect();
                    if (touchY < containerRect.top || touchY > containerRect.bottom) return;

                    const afterElement = getDragAfterElement(container, itemSelector, touchY);
                    if (afterElement == null) {
                        container.appendChild(draggedItem);
                    } else {
                        container.insertBefore(draggedItem, afterElement);
                    }
                }, { passive: false });

                handle.addEventListener('touchend', () => {
                    if (draggedItem) {
                        draggedItem.classList.remove('dragging');
                        draggedItem = null;
                        if (onOrderUpdated) onOrderUpdated();
                    }
                });
            });

            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!draggedItem) return;
                
                const containerRect = container.getBoundingClientRect();
                if (e.clientY < containerRect.top || e.clientY > containerRect.bottom) return;

                const afterElement = getDragAfterElement(container, itemSelector, e.clientY);
                if (afterElement == null) {
                    container.appendChild(draggedItem);
                } else {
                    container.insertBefore(draggedItem, afterElement);
                }
            });
        }

        function getDragAfterElement(container, selector, y) {
            const draggableElements = [...container.querySelectorAll(`${selector}:not(.dragging)`)];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function closeAllMenus() {
            activeDropdownOwnerId = null;
            const globalMenu = document.getElementById('globalCardDropdown');
            if (globalMenu) {
                globalMenu.classList.remove('show');

            document.querySelectorAll('.dropdown-menu').forEach(m => {

            document.querySelectorAll('.card').forEach(c => c.classList.remove('active-card'));
        }

        function positionDropdownNearTrigger(menu, triggerEl, estimatedHeight) {
            if (!menu || !triggerEl) return;
            const rect = triggerEl.getBoundingClientRect();
            const menuWidth = 144;
            let topPos = rect.bottom + 4;
            if (topPos + estimatedHeight > window.innerHeight - 10) {
                topPos = Math.max(10, rect.top - estimatedHeight - 4);
            }
            let leftPos = rect.right - menuWidth;
            if (leftPos < 10) leftPos = 10;
            if (leftPos + menuWidth > window.innerWidth - 10) {
                leftPos = Math.max(10, window.innerWidth - menuWidth - 10);
            }
            menu.style.top = topPos + 'px';
            menu.style.left = leftPos + 'px';
            menu.style.right = 'auto';
        }

        function openCardDropdown(e, itemId, isPinned) {
            if (e) {
                e.stopPropagation();
                if (e.cancelable) e.preventDefault();
            }
            const now = Date.now();
            if (now - lastDotsTriggerTime < 200) return;
            lastDotsTriggerTime = now;

            const ownerKey = 'card-' + itemId;
            const menu = document.getElementById('globalCardDropdown');
            if (!menu) return;

            if (activeDropdownOwnerId === ownerKey && menu.classList.contains('show')) {
                closeAllMenus();
                return;
            }

            closeAllMenus();
            activeDropdownOwnerId = ownerKey;

            const targetList = (currentTab === 'Memo') ? memos : hobbyPosts;
            const targetItem = targetList.find(i => i.id == itemId);
            const isLocked = !!(targetItem && targetItem.password && targetItem.password.length === 4);

            const itemTypeKey = (currentTab === 'Memo') ? 'memo' : 'hobby';
            const pinText = isPinned ? '상단고정 해제' : '상단고정';
            const lockMenuText = isLocked ? '잠금 해제' : '잠금 설정';

            menu.innerHTML = `
                <div class="dropdown-item" onclick="triggerMenuAction(() => handleEditItem(${itemId}))">수정</div>
                <div class="dropdown-item" onclick="triggerMenuAction(() => promptLockSetup(${itemId}))">${lockMenuText}</div>
                <div class="dropdown-item" onclick="triggerMenuAction(() => togglePinItem(${itemId}, '${itemTypeKey}'))">${pinText}</div>
                <div class="dropdown-item" onclick="triggerMenuAction(() => toggleBatchMode())">다중 선택</div>
                <div class="dropdown-item delete" onclick="triggerMenuAction(() => deleteItem(${itemId}, '${itemTypeKey}'))">삭제</div>
            `;

            const triggerEl = e && e.currentTarget ? e.currentTarget : null;
            positionDropdownNearTrigger(menu, triggerEl, 225);
            menu.classList.add('show');

            const cardEl = triggerEl ? triggerEl.closest('.card') : null;
            if (cardEl) cardEl.classList.add('active-card');
        }

        function renderSidebar() {
            const menuList = document.getElementById('menuList');

        function savePageSetting() {
            const pageName = document.getElementById('targetPageKey').value;
            const rows = document.querySelectorAll('.session-row-item');
            let newFolders = [];
            let folderMapping = {};

            for (let row of rows) {
                let oldName = row.dataset.oldName;
                let inputVal = row.querySelector('.sess-name-input').value.trim();
                if (!inputVal) continue;
                if (newFolders.includes(inputVal)) {
                    alert(`세션 이름이 중복됩니다: ${inputVal}`);
                    return;
                }
                newFolders.push(inputVal);
                if (oldName) folderMapping[oldName] = inputVal;
            }

            if (pageName === 'Memo') {
                memoFolders = newFolders;
                localStorage.setItem('memoFolders', JSON.stringify(memoFolders));
                memos.forEach(m => {
                    if (folderMapping[m.folder]) m.folder = folderMapping[m.folder];
                });
                localStorage.setItem('memos', JSON.stringify(memos));
            } else {
                hobbyFolders[pageName] = newFolders;
                localStorage.setItem('hobbyFolders', JSON.stringify(hobbyFolders));
                hobbyPosts.forEach(p => {
                    if (p.page === pageName && folderMapping[p.folder]) p.folder = folderMapping[p.folder];
                });
                localStorage.setItem('hobbyPosts', JSON.stringify(hobbyPosts));

                const newName = document.getElementById('editPageName').value.trim();
                const newBg = document.getElementById('editPageBg').value;
                const newAccent = document.getElementById('editPageAccent').value;

                if(!newName) return alert('아카이브 이름을 입력해 주세요.');
                if(pageName !== newName && themes[newName]) return alert('이미 존재하는 이름입니다.');

                if(pageName !== newName) {
                    themes[newName] = themes[pageName];
                    delete themes[pageName];
                    hobbyFolders[newName] = hobbyFolders[pageName] || [];
                    delete hobbyFolders[pageName];
                    hobbyPosts.forEach(p => { if(p.page === pageName) p.page = newName; });
                    
                    const idx = archiveOrder.indexOf(pageName);
                    if (idx !== -1) archiveOrder[idx] = newName;
                    localStorage.setItem('archiveOrder', JSON.stringify(archiveOrder));
                }

                themes[newName].bg = newBg;
                themes[newName].accent = newAccent;
                localStorage.setItem('themes', JSON.stringify(themes));
                localStorage.setItem('hobbyFolders', JSON.stringify(hobbyFolders));
                localStorage.setItem('hobbyPosts', JSON.stringify(hobbyPosts));
                if(currentTab === pageName) currentTab = newName;
            }

            toggleSettingModal(false);
            renderSidebar();
            setTheme(currentTab);
            render();
        }

        function addMediaInputRow(val = '', isExistingData = false, fileType = 'image') {
            const container = document.getElementById('mediaInputsContainer');
            const row = document.createElement('div');
            row.className = 'media-input-row';
            const uniqueId = 'file-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
            const hasContent = val.trim() !== '';

            let displayVal = val;
            let lockedAttr = '';
            let lockedClass = '';
            if (isExistingData && (val.startsWith('data:') || val.startsWith('blob:') || val.startsWith('file:'))) {
                displayVal = '첨부된 미디어 파일';
                lockedAttr = 'readonly';
                lockedClass = 'locked';
                row.dataset.existingData = val;
                row.dataset.fileType = fileType;
            }

            row.innerHTML = `
                <div class="unified-input-box ${lockedClass}">
                    <input type="text" class="modal-media-url" placeholder="사진/움짤 파일 선택 또는 링크(URL)" value="${displayVal}" ${lockedAttr} style="margin-bottom:0;">
                    <label for="${uniqueId}" class="file-select-label">파일 선택</label>
                    <input type="file" id="${uniqueId}" class="modal-media-file" accept="image/*,.gif" style="display: none;" onchange="handleFileSelect(this)">
                </div>
                <button type="button" class="remove-row-btn" style="display: ${hasContent ? 'inline-block' : 'none'};" onclick="removeMediaRow(this)">삭제</button>
            `;
            container.appendChild(row);
        }

        function handleFileSelect(input) {
            const row = input.closest('.media-input-row');
            const box = row.querySelector('.unified-input-box');
            const textInput = row.querySelector('.modal-media-url');
            const removeBtn = row.querySelector('.remove-row-btn');

            if (input.files && input.files[0]) {
                const file = input.files[0];
                const blobUrl = URL.createObjectURL(file);
                row.dataset.existingData = blobUrl;
                row.dataset.fileType = 'image';

                textInput.value = file.name;
                textInput.readOnly = true;
                box.classList.add('locked');
                removeBtn.style.display = 'inline-block';

                const rows = document.querySelectorAll('.media-input-row');
                if (rows[rows.length - 1] === row) {
                    addMediaInputRow();
                }
            }
        }

        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('modal-media-url') && !e.target.readOnly) {
                const row = e.target.closest('.media-input-row');
                const removeBtn = row.querySelector('.remove-row-btn');
                const val = e.target.value.trim();
                const hasText = val !== '';
                removeBtn.style.display = hasText ? 'inline-block' : 'none';

                if (val.startsWith('http://') || val.startsWith('https://')) {
                    row.dataset.fileType = 'link';
                } else {
                    row.dataset.fileType = 'image';
                }

                const container = document.getElementById('mediaInputsContainer');
                const rows = container.querySelectorAll('.media-input-row');
                if (rows[rows.length - 1] === row && hasText) {
                    addMediaInputRow();
                }
            }
        });

        function removeMediaRow(btn) {
            const row = btn.closest('.media-input-row');
            const container = document.getElementById('mediaInputsContainer');
            const rows = container.querySelectorAll('.media-input-row');

            if (rows.length > 1) {
                row.remove();
            } else {
                const box = row.querySelector('.unified-input-box');
                const textInput = row.querySelector('.modal-media-url');
                const fileInput = row.querySelector('.modal-media-file');
                textInput.value = '';
                textInput.readOnly = false;
                box.classList.remove('locked');
                delete row.dataset.existingData;
                delete row.dataset.fileType;
                if (fileInput) fileInput.value = '';
                btn.style.display = 'none';
            }

            const updatedRows = container.querySelectorAll('.media-input-row');
            const lastRow = updatedRows[updatedRows.length - 1];
            const lastText = lastRow.querySelector('.modal-media-url').value.trim();
            if (lastText !== '') {
                addMediaInputRow();
            }
        }

        async function savePost() {
            const editId = document.getElementById('editTargetId').value;
            const folder = document.getElementById('modalFolder').value || '미분류';
            const title = document.getElementById('modalTitle').value.trim();
            const content = document.getElementById('modalContent').value.trim();
            
            if(!title && !content) {
                alert('제목이나 내용 중 최소한 하나는 입력해 주세요.');
                return;
            }

            const rows = Array.from(document.querySelectorAll('.media-input-row'));
            const collectedMediaObjects = [];
            const collectedLinks = [];

            for (let row of rows) {
                const textInput = row.querySelector('.modal-media-url');
                let urlVal = '';
                let fType = row.dataset.fileType || 'image';

                if (row.dataset.existingData) {
                    urlVal = row.dataset.existingData;
                } else {
                    urlVal = textInput.value.trim();
                    if (urlVal.startsWith('http://') || urlVal.startsWith('https://')) {
                        fType = 'link';
                    }
                }

                if (urlVal) {
                    if (fType === 'link') {
                        collectedLinks.push(urlVal);
                    } else {
                        collectedMediaObjects.push({ url: urlVal, type: fType });
                    }
                }
            }

            if (currentTab === 'Memo') {
                if (editId) {
                    let target = memos.find(m => m.id == editId);
                    if (target) {
                        target.type = 'note';
                        target.folder = folder;
                        target.title = title;
                        target.content = content;
                        target.mediaObjects = collectedMediaObjects;
                        target.images = collectedMediaObjects.map(m => m.url);
                        target.links = collectedLinks;
                    }
                } else {
                    memos.unshift({ 
                        id: Date.now(), 
                        type: 'note',
                        folder, 
                        title, 
                        content, 
                        mediaObjects: collectedMediaObjects,
                        images: collectedMediaObjects.map(m => m.url),
                        links: collectedLinks,
                        date: new Date().toISOString().slice(0,10), 
                        favorite: false,
                        pinned: false,
                        password: ''
                    });
                }
                localStorage.setItem('memos', JSON.stringify(memos));
            } else {
                if (editId) {
                    let target = hobbyPosts.find(p => p.id == editId);
                    if (target) {
                        target.type = 'note';
                        target.folder = folder;
                        target.title = title;
                        target.thought = content;
                        target.mediaObjects = collectedMediaObjects;
                        target.images = collectedMediaObjects.map(m => m.url);
                        target.links = collectedLinks;
                    }
                } else {
                    hobbyPosts.unshift({ 
                        id: Date.now(), 
                        page: currentTab, 
                        type: 'note',
                        folder, 
                        title, 
                        thought: content, 
                        mediaObjects: collectedMediaObjects,
                        images: collectedMediaObjects.map(m => m.url),
                        links: collectedLinks,
                        date: new Date().toISOString().slice(0,10), 
                        favorite: false,
                        pinned: false,
                        password: ''
                    });
                }
                localStorage.setItem('hobbyPosts', JSON.stringify(hobbyPosts));
            }

            toggleModal(false);
            render();
        }

        function toggleFavorite(id, type) {
            if (type === 'memo') {
                let target = memos.find(m => m.id == id);
                if (target) target.favorite = !target.favorite;
                localStorage.setItem('memos', JSON.stringify(memos));
            } else {
                let target = hobbyPosts.find(p => p.id == id);
                if (target) target.favorite = !target.favorite;
                localStorage.setItem('hobbyPosts', JSON.stringify(hobbyPosts));
            }
            render();
        }

        function deleteItem(id, type) {
            if(!confirm('정말 삭제하시겠습니까?')) return;
            if(type === 'memo') {
                memos = memos.filter(m => m.id != id);
                localStorage.setItem('memos', JSON.stringify(memos));
            } else {
                hobbyPosts = hobbyPosts.filter(p => p.id != id);
                localStorage.setItem('hobbyPosts', JSON.stringify(hobbyPosts));
            }
            if(viewingDetailId == id) viewingDetailId = null;
            render();
        }

        function openCardClick(id) {
            const globalMenu = document.getElementById('globalCardDropdown');
            if (globalMenu && globalMenu.classList.contains('show')) {
                closeAllMenus();
                return;
            }
            let targetList = (currentTab === 'Memo') ? memos : hobbyPosts;
            let target = targetList.find(i => i.id == id);
            if (!target) return;

            if (target.password && target.password.length === 4) {
                document.getElementById('pwModalTitle').innerText = '잠긴 메모입니다 (비밀번호 4자리)';
                document.getElementById('pwInput').value = '';
                document.getElementById('pwActionType').value = 'unlock';
                document.getElementById('pwTargetId').value = id;
                document.getElementById('passwordModal').classList.add('open');
                setTimeout(() => document.getElementById('pwInput').focus(), 100);
            } else {
                viewingDetailId = id;
                render();
            }
        }

        function togglePasswordModal(open) {
            document.getElementById('passwordModal').classList.toggle('open', open);
        }

        function promptLockSetup(id) {
            let targetList = (currentTab === 'Memo') ? memos : hobbyPosts;
            let target = targetList.find(i => i.id == id);
            if (!target) return;

            if (target.password && target.password.length === 4) {
                document.getElementById('pwModalTitle').innerText = '잠금 해제를 위해 비밀번호 4자리 입력';
                document.getElementById('pwInput').value = '';
                document.getElementById('pwActionType').value = 'unlock_clear';
                document.getElementById('pwTargetId').value = id;
                document.getElementById('passwordModal').classList.add('open');
                setTimeout(() => document.getElementById('pwInput').focus(), 100);
            } else {
                document.getElementById('pwModalTitle').innerText = '새 비밀번호 4자리 설정';
                document.getElementById('pwInput').value = '';
                document.getElementById('pwActionType').value = 'setlock';
                document.getElementById('pwTargetId').value = id;
                document.getElementById('passwordModal').classList.add('open');
                setTimeout(() => document.getElementById('pwInput').focus(), 100);
            }
        }

        function submitPasswordModal() {
            const val = document.getElementById('pwInput').value.trim();
            const action = document.getElementById('pwActionType').value;
            const id = document.getElementById('pwTargetId').value;

            if (val.length !== 4) {
                alert('비밀번호는 정확히 4자리여야 합니다.');
                return;
            }

            let targetList = (currentTab === 'Memo') ? memos : hobbyPosts;
            let target = targetList.find(i => i.id == id);
            if (!target) return;

            if (action === 'unlock') {
                if (target.password === val) {
                    togglePasswordModal(false);
                    viewingDetailId = id;
                    render();
                } else {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else if (action === 'unlock_clear') {
                if (target.password === val) {
                    target.password = '';
                    saveCurrentListStorage();
                    togglePasswordModal(false);
                    alert('잠금이 해제되었습니다.');
                    render();
                } else {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else if (action === 'edit') {
                if (target.password === val) {
                    togglePasswordModal(false);
                    openEditModalForItem(target);
                } else {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else if (action === 'setlock') {
                target.password = val;
                saveCurrentListStorage();
                togglePasswordModal(false);
                alert('비밀번호가 설정되었습니다.');
                render();
            }
        }

        function saveCurrentListStorage() {
            if (currentTab === 'Memo') {
                localStorage.setItem('memos', JSON.stringify(memos));
            } else {
                localStorage.setItem('hobbyPosts', JSON.stringify(hobbyPosts));
            }
        }

        function toggleBatchMode() {
            isBatchMode = !isBatchMode;
            if (!isBatchMode) {
                selectedItemIds.clear();
            }
            render();
        }

        function toggleItemSelection(id) {
            if (selectedItemIds.has(id)) {
                selectedItemIds.delete(id);
            } else {
                selectedItemIds.add(id);
            }
            updateBatchDeleteBar();
        }

        function toggleSelectAll(idsArray) {
            if (selectedItemIds.size === idsArray.length) {
                selectedItemIds.clear();
            } else {
                idsArray.forEach(id => selectedItemIds.add(id));
            }
            render();
        }

        function updateBatchDeleteBar() {
            const countEl = document.getElementById('selectedCount');
            if (countEl) countEl.innerText = selectedItemIds.size;
        }

        function deleteSelectedItems() {
            if (selectedItemIds.size === 0) return;
            if (!confirm(`선택한 ${selectedItemIds.size}개의 항목을 정말 삭제하시겠습니까?`)) return;

            if (currentTab === 'Memo') {
                memos = memos.filter(m => !selectedItemIds.has(m.id));
                localStorage.setItem('memos', JSON.stringify(memos));
            } else {
                hobbyPosts = hobbyPosts.filter(p => !selectedItemIds.has(p.id));
                localStorage.setItem('hobbyPosts', JSON.stringify(hobbyPosts));
            }
            selectedItemIds.clear();
            isBatchMode = false;
            viewingDetailId = null;
            render();
        }

        function openMediaModal(src) {
            const wrapper = document.getElementById('modalZoomWrapper');
            wrapper.innerHTML = `<img src="${src}" alt="확대 이미지">`;
            document.getElementById('imageModal').classList.add('open');
        }

        function closeImageModal() {
            document.getElementById('imageModal').classList.remove('open');
            document.getElementById('modalZoomWrapper').innerHTML = '';
        }

        function toggleSearchBox() {
            const sidebar = document.getElementById('appSidebar');
            if (window.innerWidth <= 768 && sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                document.body.classList.remove('sidebar-open');
                return;
            }

            const box = document.getElementById('searchInputBox');
            if (!box) return;
            box.classList.toggle('open');
            if (box.classList.contains('open')) {
                const input = document.getElementById('searchInput');
                if (input) input.focus();
            } else {
                searchQuery = '';
                const input = document.getElementById('searchInput');
                if (input) input.value = '';
                updateFilteredCardsOnly();
            }
        }

        function handleSearchInput(e) {
            if (isComposingSearch) return;
            searchQuery = e.target.value.trim().toLowerCase();
            updateFilteredCardsOnly();
        }

        function hasPhotoAttached(item) {
            if (Array.isArray(item.mediaObjects) && item.mediaObjects.length > 0) return true;
            if (Array.isArray(item.images) && item.images.length > 0) return true;
            return false;
        }

        function hasLinkAttached(item) {
            if (Array.isArray(item.links) && item.links.length > 0) return true;
            const combinedText = `${item.title || ''} ${item.content || ''} ${item.thought || ''}`;
            return /https?:\/\//i.test(combinedText);
        }

        function matchesSearchQuery(item, q) {
            if (!q) return true;
            const isLocked = !!(item.password && item.password.length === 4);
            const titleLower = (item.title || '').toLowerCase();
            const bodyLower = `${item.content || ''} ${item.thought || ''}`.toLowerCase();

            if (isLocked) {
                return titleLower.includes(q);
            }

            if (q === '#사진') {
                return titleLower.includes('#사진') || bodyLower.includes('#사진') || hasPhotoAttached(item);
            }

            if (q === '#링크') {
                return titleLower.includes('#링크') || bodyLower.includes('#링크') || hasLinkAttached(item);
            }

            return titleLower.includes(q) || bodyLower.includes(q);
        }

        function getFilteredDataSource() {
            let dataSource = (currentTab === 'Memo') ? memos : hobbyPosts.filter(p => p.page === currentTab);

            if (currentSession === '즐겨찾기') {
                dataSource = dataSource.filter(item => item.favorite);
            } else if (currentSession !== '전체') {
                dataSource = dataSource.filter(item => (item.folder || '미분류') === currentSession);
            }

            if (searchQuery) {
                dataSource = dataSource.filter(item => matchesSearchQuery(item, searchQuery));
            }

            dataSource.sort((a, b) => {
                if (a.pinned && !b.pinned) return -1;
                if (!a.pinned && b.pinned) return 1;
                return b.id - a.id;
            });

            return dataSource;
        }

        function buildCardsHtml(dataSource) {
            return dataSource.map(item => {
                let isChecked = selectedItemIds.has(item.id) ? 'checked' : '';
                let displayFolder = item.folder || '미분류';
                let badgeHtml = `<span style="background: var(--accent-color); color: #fff; padding: 2px 6px; border-radius: 4px; font-size: 0.75rem; margin-right: 6px; flex-shrink: 0;">${displayFolder}</span>`;
                let typeBadgeHtml = `<span class="type-badge">${item.type === 'checklist' ? '체크리스트' : '노트'}</span>`;
                
                let pinBadge = item.pinned ? `<span class="pin-inline-badge" title="상단고정됨">📌 PIN</span>` : '';
                let isLocked = item.password && item.password.length === 4;
                let lockIndicator = isLocked ? LOCK_OUTLINE_SVG : '';

                let mediaCount = getMediaCount(item);
                let mediaCountHtml = mediaCount > 0 ? `<span class="media-count-tag">사진/GIF ${mediaCount}개</span>` : '';

                let titleStr = item.title ? item.title : '제목 없음';
                let itemTypeKey = (currentTab === 'Memo') ? 'memo' : 'hobby';

                return `
                    <div class="card ${isBatchMode ? 'batch-mode' : ''}" onclick="openCardClick(${item.id})">
                        <div class="card-top-actions" onclick="event.stopPropagation()">
                            <input type="checkbox" class="card-checkbox" ${isChecked} onclick="toggleItemSelection(${item.id})" title="선택">
                            <button type="button" class="star-btn ${item.favorite ? 'active' : ''}" onclick="toggleFavorite(${item.id}, '${itemTypeKey}')">${CUTE_STAR_SVG}</button>
                            <div class="sidebar-dots-container">
                                <button type="button" class="dots-btn" onclick="openCardDropdown(event, ${item.id}, ${!!item.pinned})">⋮</button>
                            </div>
                        </div>
                        <div style="display:flex; align-items:center; justify-content:space-between; padding-right:85px;">
                            <div style="display:flex; align-items:center; overflow:hidden; min-width:0;">
                                ${badgeHtml}
                                <h3 style="font-size:1.05rem; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin:0;">${titleStr}</h3>
                                ${pinBadge}
                                ${lockIndicator}
                            </div>
                        </div>
                        <div class="card-meta-row">
                            <div class="card-meta-left">
                                <span>${item.date}</span>
                            </div>
                            <div class="card-meta-right">
                                ${typeBadgeHtml}
                                ${mediaCountHtml}
                            </div>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function updateFilteredCardsOnly() {
            const listContainer = document.getElementById('cardsListContainer');
            if (!listContainer) {
                render();
                return;
            }
            const dataSource = getFilteredDataSource();
            listContainer.innerHTML = buildCardsHtml(dataSource) || '<p>검색 결과가 없거나 작성된 기록이 없습니다.</p>';
        }

        document.addEventListener('click', function(event) {
            if (!event.target.closest('.dots-btn') && !event.target.closest('.dropdown-menu')) {
                closeAllMenus();
            }
        });

        function linkifyText(text) {
            if (!text) return '';
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" rel="noopener noreferrer">${url}</a>`;
            });
        }

        function getMediaCount(item) {
            if (Array.isArray(item.mediaObjects) && item.mediaObjects.length > 0) {
                return item.mediaObjects.length;
            }
            if (Array.isArray(item.images) && item.images.length > 0) {
                return item.images.length;
            }
            return 0;
        }

        function render() {
            closeAllMenus();
            const main = document.getElementById('mainContent');
            let folders = (currentTab === 'Memo') ? memoFolders : (hobbyFolders[currentTab] || []);

            let tabsHtml = `<div class="session-tabs">
                <div class="session-tab ${currentSession === '전체' ? 'active' : ''}" onclick="currentSession='전체'; viewingDetailId=null; render();">전체</div>
                <div class="session-tab ${currentSession === '즐겨찾기' ? 'active' : ''}" onclick="currentSession='즐겨찾기'; viewingDetailId=null; render();">${TAB_STAR_SVG} 즐겨찾기</div>
                <div class="session-tab ${currentSession === '미분류' ? 'active' : ''}" onclick="currentSession='미분류'; viewingDetailId=null; render();">미분류</div>`;
            for(let f of folders) {
                let isAct = currentSession === f ? 'active' : '';
                tabsHtml += `<div class="session-tab ${isAct}" onclick="currentSession='${f}'; viewingDetailId=null; render();">${f}</div>`;
            }
            tabsHtml += `</div>`;

            let pageTitle = (currentTab === 'Memo') ? 'Memo' : `${currentTab} Archive`;
            let dataSource = getFilteredDataSource();

            if (viewingDetailId !== null) {
                let item = dataSource.find(i => i.id == viewingDetailId);
                if (!item) {
                    viewingDetailId = null;
                } else {
                    let isLocked = item.password && item.password.length === 4;
                    let lockBtnText = isLocked ? `${UNLOCK_OUTLINE_SVG} 잠금 해제` : `${UNLOCK_OUTLINE_SVG} 잠금 설정`;
                    let lockBtnClass = isLocked ? 'lock-toggle-btn locked' : 'lock-toggle-btn';

                    let typeLabel = item.type === 'checklist' ? '체크리스트' : '노트';
                    let titleStr = item.title ? `<h2>${item.title}</h2>` : `<h2>제목 없음</h2>`;
                    let bodyHtml = '';
                    if (item.type === 'checklist' && item.checkItems) {
                        let checkListInner = item.checkItems.map((ci, idx) => `
                            <div class="checklist-item">
                                <input type="checkbox" ${ci.checked ? 'checked' : ''} onclick="toggleCheckItemState(${item.id}, ${idx})">
                                <span class="${ci.checked ? 'checked' : ''}">${ci.text}</span>
                            </div>
                        `).join('');
                        bodyHtml = `<div class="checklist-container">${checkListInner}</div>`;
                    } else {
                        let textVal = item.content || item.thought || '';
                        bodyHtml = textVal ? `<div class="card-text">${linkifyText(textVal)}</div>` : '';
                    }

                    let linksList = item.links || [];
                    let linksHtml = linksList.map(link => `
                        <a href="${link}" target="_blank" rel="noopener noreferrer" class="link-card-box">
                            <span>🔗 ${link}</span>
                            <span style="font-size:0.8rem; opacity:0.7;">방문하기 ↗</span>
                        </a>
                    `).join('');

                    let mediaList = item.mediaObjects || (item.images ? item.images.map(url => ({ url, type: 'image' })) : []);
                    let mediaHtml = mediaList.map(media => `
                        <div class="media-container" onclick="openMediaModal('${media.url}')">
                            <img src="${media.url}" alt="이미지" onerror="this.style.display='none'">
                            <span class="zoom-badge">⤢</span>
                        </div>
                    `).join('');

                    main.innerHTML = `
                        <div class="header-bar">
                            <button type="button" class="btn" style="width: auto; padding: 6px 14px; font-size: 0.9rem; white-space: nowrap;" onclick="viewingDetailId=null; render();">← 목록으로</button>
                            <div class="search-container">
                                <div class="search-input-box" id="searchInputBox">
                                    <input type="text" id="searchInput" placeholder="제목/내용 검색..." value="${searchQuery}">
                                </div>
                                <button type="button" class="search-btn" onclick="toggleSearchBox()" title="검색">${SEARCH_ICON_SVG}</button>
                            </div>
                        </div>
                        <div class="detail-view">
                            <div class="detail-header-actions">
                                <div style="display:flex; align-items:center; gap:6px; flex-wrap:wrap; min-width:0;">
                                    <span style="background: var(--accent-color); color: #fff; padding: 2px 8px; border-radius: 4px; font-size: 0.8rem; white-space: nowrap;">${item.folder || '미분류'}</span>
                                    <span class="type-badge">${typeLabel}</span>
                                    <span style="font-size: 0.8rem; opacity: 0.7; white-space: nowrap;">${item.date}</span>
                                </div>
                                <button type="button" class="${lockBtnClass}" onclick="promptLockSetup(${item.id})">${lockBtnText}</button>
                            </div>
                            ${titleStr}
                            ${bodyHtml}
                            ${linksList.length > 0 ? `<div class="link-wrapper">${linksHtml}</div>` : ''}
                            ${mediaList.length > 0 ? `<div class="media-wrapper">${mediaHtml}</div>` : ''}
                        </div>
                    `;
                    bindSearchEvents();
                    return;
                }
            }

            const currentDataSourceIds = dataSource.map(item => item.id);
            let allSelected = currentDataSourceIds.length > 0 && currentDataSourceIds.every(id => selectedItemIds.has(id));

            let batchBarHtml = `
                <div class="batch-delete-bar ${isBatchMode ? 'show' : ''}" id="batchDeleteBar">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:0.9rem; font-weight:bold;">총 <span id="selectedCount">${selectedItemIds.size}</span>개 선택됨</span>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button type="button" class="btn" style="background:#555; padding:6px 12px; font-size:0.85rem; min-height:auto; white-space:nowrap;" onclick='toggleSelectAll(${JSON.stringify(currentDataSourceIds)})'>${allSelected ? '전체 해제' : '전체 선택'}</button>
                        <button type="button" class="btn" style="background:#d9534f; padding:6px 12px; font-size:0.85rem; min-height:auto; white-space:nowrap;" onclick="deleteSelectedItems()">선택 삭제</button>
                        <button type="button" class="btn" style="background:#888; padding:6px 12px; font-size:0.85rem; min-height:auto; white-space:nowrap;" onclick="toggleBatchMode()">취소</button>
                    </div>
                </div>
            `;

            let cards = buildCardsHtml(dataSource);

            main.innerHTML = `
                <div class="header-bar">
                    <h1>${pageTitle}</h1>
                    <div class="search-container">
                        <div class="search-input-box ${searchQuery ? 'open' : ''}" id="searchInputBox">
                            <input type="text" id="searchInput" placeholder="제목/내용 검색..." value="${searchQuery}">
                        </div>
                        <button type="button" class="search-btn" onclick="toggleSearchBox()" title="검색">${SEARCH_ICON_SVG}</button>
                    </div>
                </div>
                ${tabsHtml}
                ${batchBarHtml}
                <div id="cardsListContainer">${cards || '<p>검색 결과가 없거나 작성된 기록이 없습니다.</p>'}</div>
                <button type="button" class="fab" onclick="toggleTypeSelectModal(true)">+</button>
            `;

            bindSearchEvents();

            if (searchQuery) {
                const box = document.getElementById('searchInputBox');
                const input = document.getElementById('searchInput');
                if (box && input) {
                    box.classList.add('open');
                    input.focus();
                    input.setSelectionRange(input.value.length, input.value.length);
                }
            }
        }

        function bindSearchEvents() {
            const input = document.getElementById('searchInput');
            if (!input) return;
            input.addEventListener('compositionstart', () => {
                isComposingSearch = true;
            });
            input.addEventListener('compositionend', (e) => {
                isComposingSearch = false;
                searchQuery = e.target.value.trim().toLowerCase();
                updateFilteredCardsOnly();
            });
            input.addEventListener('input', handleSearchInput);
        }

        renderSidebar();
        render();
    </script>

</body></html>
