<!DOCTYPE html>
<html lang="ko" style="--bg-color: #F7F4EE; --card-color: #FFFFFF; --accent-color: #3B6E8C; --text-color: #1E3A5F; --sub-bg: #EAE3D2;">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>The B-Archive</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-color: #F7F4EE;
            --card-color: #FFFFFF;
            --accent-color: #3B6E8C;
            --text-color: #1E3A5F;
            --sub-bg: #EAE3D2;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        *:focus {
            outline: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            height: 100vh;
            overflow: hidden;
            width: 100vw;
            transition: background 0.25s, color 0.25s;
        }

        body.sidebar-open::after {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.3);
            z-index: 1500;
            display: block;
        }

        sidebar {
            width: 260px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border-right: 2px solid var(--sub-bg);
            display: flex;
            flex-direction: column;
            padding: 20px;
            z-index: 1600;
            position: relative;
            flex-shrink: 0;
        }

        .sidebar-header {
            font-size: 1.2rem;
            font-weight: bold;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .mobile-close-btn {
            display: none;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 1.5rem;
            cursor: pointer;
            line-height: 1;
            padding: 2px 6px;
        }

        .menu-list {
            list-style: none;
            flex-grow: 1;
            overflow-y: auto;
            overflow-x: visible;
            position: relative;
        }

        .menu-item {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 6px;
            font-weight: 500;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            font-size: 1rem;
            user-select: none;
            background-color: transparent;
        }

        .menu-item-clickable {
            flex: 1;
            min-width: 0;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .menu-item:hover, .menu-item.active {
            background-color: var(--sub-bg);
            color: var(--accent-color);
        }

        .menu-item.dragging, .session-row-item.dragging {
            opacity: 0.4;
            background-color: var(--sub-bg);
        }

        .drag-handle {
            cursor: grab;
            opacity: 0.5;
            margin-left: 4px;
            margin-right: 2px;
            font-size: 1rem;
            letter-spacing: -2px;
            touch-action: none;
            padding: 6px 4px;
        }

        .drag-handle:active {
            cursor: grabbing;
        }

        .add-section {
            border-top: 1px solid var(--sub-bg);
            padding-top: 15px;
            margin-top: 10px;
        }

        .btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
            font-size: 0.95rem;
            min-height: 44px;
            user-select: none;
        }

        .btn:hover {
            opacity: 0.92;
        }

        .mobile-top-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            background-color: var(--bg-color);
            color: var(--text-color);
            border-bottom: 2px solid var(--sub-bg);
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            z-index: 1500;
        }

        .hamburger-btn {
            background: none;
            border: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 5px;
            padding: 5px;
            z-index: 1550;
        }

        .hamburger-btn span {
            display: block;
            width: 24px;
            height: 3px;
            background-color: var(--text-color);
            border-radius: 2px;
        }

        main {
            flex-grow: 1;
            padding: 30px;
            overflow-y: auto;
            position: relative;
            width: 100%;
            min-width: 0;
            max-width: 100%;
        }

        .header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            position: relative;
            min-width: 0;
        }

        .header-bar h1 {
            font-size: 1.7rem;
            flex: 1;
            min-width: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 1.3;
        }

        .batch-delete-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            background: var(--card-color);
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid var(--sub-bg);
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            width: 100%;
            margin-bottom: 15px;
        }
        .batch-delete-bar.show {
            display: flex;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
        }

        .search-btn {
            background: var(--card-color);
            border: 1px solid var(--sub-bg);
            color: var(--text-color);
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            flex-shrink: 0;
        }

        .search-btn svg {
            width: 18px;
            height: 18px;
            fill: var(--text-color);
        }

        .search-input-box {
            display: none;
            align-items: center;
            background: var(--card-color);
            border: 1px solid var(--accent-color);
            border-radius: 20px;
            padding: 4px 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            width: 170px;
        }

        .search-input-box.open {
            display: flex;
        }

        .search-input-box input {
            border: none;
            outline: none;
            background: transparent;
            width: 100%;
            font-size: 0.9rem;
            color: var(--text-color);
        }

        .session-tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 20px;
            align-items: center;
            -webkit-overflow-scrolling: touch;
            user-select: none;
        }

        .session-tab {
            padding: 8px 14px;
            background-color: var(--card-color);
            border: 1px solid var(--sub-bg);
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            white-space: nowrap;
            color: var(--text-color);
            display: inline-flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            user-select: none;
        }

        .session-tab.active {
            background-color: var(--accent-color);
            color: white;
            border-color: var(--accent-color);
        }

        .tab-star-icon {
            width: 15px;
            height: 15px;
            fill: #FFD43B;
            flex-shrink: 0;
        }

        .card {
            background-color: var(--card-color);
            border-left: 5px solid var(--accent-color);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            position: relative;
            word-break: break-word;
            user-select: none;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .card:hover {
            opacity: 0.96;
        }

        .type-badge {
            display: inline-flex;
            align-items: center;
            font-size: 0.74rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 5px;
            background-color: var(--sub-bg);
            color: var(--text-color);
            border: 1px solid currentColor;
            opacity: 0.95;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .pin-inline-badge {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            padding: 2px 6px;
            margin-left: 6px;
            border-radius: 5px;
            background-color: var(--sub-bg);
            color: var(--text-color);
            border: 1px solid currentColor;
            font-size: 0.72rem;
            font-weight: 700;
            vertical-align: middle;
            flex-shrink: 0;
            white-space: nowrap;
        }

        .lock-outline-icon {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 22px;
            height: 22px;
            margin-left: 6px;
            border-radius: 6px;
            background-color: var(--sub-bg);
            color: var(--text-color);
            border: 1px solid currentColor;
            vertical-align: middle;
            flex-shrink: 0;
        }

        .lock-outline-icon svg {
            width: 13px;
            height: 13px;
            stroke: currentColor;
            fill: none;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .media-count-tag {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 5px;
            background-color: var(--sub-bg);
            color: var(--text-color);
            border: 1px solid currentColor;
            opacity: 0.95;
            white-space: nowrap;
        }

        .card-meta-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
            font-size: 0.8rem;
            margin-top: 2px;
        }

        .card-meta-left {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
            opacity: 0.8;
        }

        .card-meta-right {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }

        .card-top-actions {
            position: absolute;
            top: 12px;
            right: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 10;
        }

        .card-checkbox {
            display: none;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }
        .batch-mode .card-checkbox {
            display: block;
        }

        .star-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 4px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .star-btn svg {
            width: 20px;
            height: 20px;
            fill: #D3D3D3;
        }

        .star-btn.active svg {
            fill: #FFD43B;
        }

        .sidebar-dots-container {
            position: relative;
            z-index: 20;
        }

        .dots-btn {
            background: none;
            border: none;
            font-size: 1.25rem;
            font-weight: bold;
            cursor: pointer;
            color: var(--text-color);
            padding: 6px 10px;
            min-width: 36px;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: manipulation;
            user-select: none;
        }

        .detail-view {
            background-color: var(--card-color);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            position: relative;
        }
        .detail-header-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 20px;
            border-bottom: 1px solid var(--sub-bg);
            padding-bottom: 15px;
        }
        .lock-toggle-btn {
            background: var(--sub-bg);
            border: 1px solid currentColor;
            padding: 7px 14px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: var(--text-color);
            white-space: nowrap;
            flex-shrink: 0;
            line-height: 1;
        }
        .lock-toggle-btn.locked {
            background-color: var(--accent-color);
            color: #FFFFFF;
            border-color: var(--accent-color);
        }
        .lock-toggle-btn.locked svg {
            stroke: #FFFFFF;
        }

        .card-text {
            line-height: 1.6;
            white-space: pre-wrap;
            font-size: 1.05rem;
            margin-top: 15px;
        }

        .card-text a, .link-card-box a {
            color: #2563EB;
            text-decoration: underline;
            font-weight: 500;
        }

        .link-wrapper {
            display: flex;
            flex-direction: column;
            gap: 6px;
            margin-top: 15px;
        }

        .link-card-box {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: rgba(0,0,0,0.03);
            border: 1px solid var(--sub-bg);
            border-radius: 8px;
            padding: 10px 14px;
            text-decoration: none;
            color: var(--text-color);
        }

        .checklist-container {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 15px;
        }
        .checklist-item {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1rem;
        }
        .checklist-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }
        .checklist-item span.checked {
            text-decoration: line-through;
            opacity: 0.5;
        }

        .media-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .media-container {
            position: relative;
            display: inline-block;
            width: 130px;
            height: 130px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--sub-bg);
            cursor: pointer;
            background: #111827;
            flex-shrink: 0;
        }

        .media-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .zoom-badge {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0,0,0,0.6);
            color: white;
            padding: 2px 4px;
            font-size: 0.7rem;
            border-radius: 4px;
        }

        .dropdown-menu {
            display: none;
            position: fixed;
            background-color: #FFFFFF !important;
            border: 1px solid #CBD5E1;
            border-radius: 10px;
            box-shadow: 0 12px 32px rgba(0,0,0,0.42);
            z-index: 9999999 !important;
            width: 144px;
            text-align: center;
            overflow: hidden;
            isolation: isolate;
        }

        .dropdown-menu.show {
            display: block;
        }

        .dropdown-item {
            padding: 12px 12px;
            font-size: 0.9rem;
            cursor: pointer;
            color: #111111 !important;
            background-color: #FFFFFF !important;
            font-weight: 600;
            touch-action: manipulation;
            border-bottom: 1px solid #E2E8F0;
            user-select: none;
            white-space: nowrap;
        }
        .dropdown-item:last-child {
            border-bottom: none;
        }
        .dropdown-item:hover, .dropdown-item:active {
            background-color: #F1F5F9 !important;
        }

        .dropdown-item.delete {
            color: #d9534f !important;
        }

        .fab {
            position: fixed;
            bottom: 25px;
            right: 25px;
            width: 56px;
            height: 56px;
            background-color: var(--accent-color);
            color: white;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2rem;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
            border: none;
            z-index: 1000;
            line-height: 0;
            padding-bottom: 4px;
            user-select: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            justify-content: center;
            align-items: center;
            z-index: 2500;
            padding: 15px;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--sub-bg);
            padding: 25px;
            border-radius: 16px;
            width: 100%;
            max-width: 460px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .modal-content h3 {
            margin-bottom: 18px;
            font-size: 1.25rem;
        }

        .modal-content input[type="text"], .modal-content input[type="password"], .modal-content textarea, .modal-content select {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid var(--sub-bg);
            border-radius: 8px;
            background: #fff;
            color: #111;
            font-size: 1rem;
        }

        .modal-content textarea {
            height: 120px;
            resize: vertical;
        }

        .color-picker-wrapper {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .color-picker-box {
            flex: 1;
            background: rgba(255,255,255,0.05);
            border: 1px solid var(--sub-bg);
            padding: 10px 12px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .color-picker-box label {
            font-size: 0.82rem;
            font-weight: bold;
            opacity: 0.9;
        }
        .color-input-styled {
            -webkit-appearance: none;
            border: none;
            width: 100%;
            height: 36px;
            border-radius: 6px;
            cursor: pointer;
            background: transparent;
        }

        .media-input-row {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
            align-items: center;
        }

        .unified-input-box {
            display: flex;
            align-items: center;
            flex: 1;
            background: #FFFFFF;
            border: 1px solid #CCCCCC;
            border-radius: 6px;
            padding: 4px 6px 4px 10px;
            min-width: 0;
        }

        .unified-input-box.locked {
            background: #F4F4F4;
        }

        .unified-input-box input[type="text"] {
            flex: 1;
            border: none;
            outline: none;
            background: transparent;
            font-size: 0.9rem;
            color: #111;
            min-width: 0;
            padding: 6px 0;
            margin-bottom: 0;
        }

        .file-select-label {
            background-color: #EFEFEF;
            border: 1px solid #767676;
            color: #000000;
            padding: 6px 10px;
            border-radius: 4px;
            font-size: 0.85rem;
            cursor: pointer;
            white-space: nowrap;
            margin-left: 6px;
            flex-shrink: 0;
        }

        .remove-row-btn {
            background: #d9534f;
            color: white;
            border: none;
            padding: 10px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: bold;
            white-space: nowrap;
            display: none;
            flex-shrink: 0;
        }

        .modal-buttons {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }

        .image-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 3000;
            cursor: pointer;
            padding: 15px;
        }
        .image-modal.open {
            display: flex;
        }
        .image-modal img {
            max-width: 100%;
            max-height: 100%;
            border-radius: 8px;
        }

        @media (max-width: 768px) {
            .mobile-top-bar {
                display: flex;
            }
            .mobile-close-btn {
                display: block;
            }
            body {
                flex-direction: column;
                overflow: auto;
            }
            sidebar {
                position: fixed;
                top: 0;
                left: -100%;
                width: 280px;
                height: 100vh;
                padding: 20px;
                transition: left 0.3s ease;
                box-shadow: 10px 0 30px rgba(0,0,0,0.5);
                z-index: 2000;
                background-color: var(--bg-color) !important;
                color: var(--text-color) !important;
                opacity: 1 !important;
                backdrop-filter: none !important;
            }
            sidebar.open {
                left: 0;
            }
            main {
                padding: 20px 15px;
                margin-top: 70px;
                height: calc(100vh - 70px);
            }
            .header-bar h1 {
                font-size: 1.35rem;
            }
        }
    </style>
</head>
<body class="">

    <div class="mobile-top-bar">
        <button type="button" class="hamburger-btn" onclick="toggleMobileSidebar(event)">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <span style="font-weight: bold; font-size: 1.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 65%;">The B-Archive</span>
        <div style="width: 24px;"></div>
    </div>

    <sidebar id="appSidebar" class="">
        <div class="sidebar-header">
            <span style="white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">The B-Archive</span>
            <button type="button" class="mobile-close-btn" onclick="toggleMobileSidebar(event)">×</button>
        </div>
        <ul class="menu-list" id="menuList" onscroll="closeAllMenus()">
            <li class="menu-item active">
                <span class="menu-item-clickable" onclick="switchTab('Memo', this.closest('.menu-item'))">Memo</span>
                <div style="display:flex; align-items:center;" onclick="event.stopPropagation();">
                    <div class="sidebar-dots-container">
                        <button type="button" class="dots-btn" onclick="openSidebarDropdown(event, 'Memo', true)">⋮</button>
                    </div>
                </div>
            </li>
        </ul>

        function getSortableTimestamp(item) {
            if (item && item.created_at) {
                const ms = Date.parse(String(item.created_at));
                if (!Number.isNaN(ms)) return ms;
            }
            const numId = Number(item && item.id);
            if (!Number.isNaN(numId) && numId > 0) return numId;
            return 0;
        }

        function compareLatestFirst(a, b) {
            if (a.pinned && !b.pinned) return -1;
            if (!a.pinned && b.pinned) return 1;

            const timeA = getSortableTimestamp(a);
            const timeB = getSortableTimestamp(b);
            if (timeB !== timeA) {
                return timeB - timeA;
            }

            const numA = Number(a.id);
            const numB = Number(b.id);
            if (!Number.isNaN(numA) && !Number.isNaN(numB) && numB !== numA) {
                return numB - numA;
            }
            return String(b.id).localeCompare(String(a.id));
        }

        function extractUrlsFromText(text) {
            if (!text) return [];
            const matches = text.match(/https?:\/\/[^\s"'<>]+/gi);
            return matches ? [...new Set(matches)] : [];
        }

        function isImageUrl(url) {
            if (!url || typeof url !== 'string') return false;
            const trimmed = url.trim();
            if (!trimmed) return false;
            if (/^data:image\/[a-zA-Z0-9.+-]+;base64,/i.test(trimmed)) return true;
            if (trimmed.startsWith('blob:')) return true;
            return /\.(png|jpe?g|gif|webp|bmp|svg|avif)(\?.*)?$/i.test(trimmed);
        }

        function parseStoredMediaField(rawVal) {
            if (!rawVal) return [];
            if (Array.isArray(rawVal)) {
                return [...new Set(rawVal.map(s => String(s || '').trim()).filter(Boolean))];
            }
            const str = String(rawVal).trim();
            if (!str) return [];

            if (str.startsWith('[')) {
                try {
                    const parsed = JSON.parse(str);
                    if (Array.isArray(parsed)) {
                        return [...new Set(parsed.map(s => String(s || '').trim()).filter(Boolean))];
                    }
                } catch (_) {}
            }

            const result = [];
            const dataUriRegex = /data:image\/[a-zA-Z0-9.+-]+;base64,[A-Za-z0-9+/=]+/gi;
            let lastIndex = 0;
            let match;
            while ((match = dataUriRegex.exec(str)) !== null) {
                const before = str.slice(lastIndex, match.index);
                before.split(/[\n,]+/).forEach(part => {
                    const cleaned = part.trim();
                    if (cleaned) result.push(cleaned);
                });
                result.push(match[0].trim());
                lastIndex = match.index + match[0].length;
            }
            const after = str.slice(lastIndex);
            after.split(/[\n,]+/).forEach(part => {
                const cleaned = part.trim();
                if (cleaned) result.push(cleaned);
            });

            return [...new Set(result)];
        }

        function parseJsonArraySafe(rawVal, fallback = []) {
            if (!rawVal) return fallback;
            if (Array.isArray(rawVal)) return rawVal;
            try {
                const parsed = JSON.parse(String(rawVal));
                return Array.isArray(parsed) ? parsed : fallback;
            } catch (_) {
                return fallback;
            }
        }

        function classifyLinksAndImages(textContent, collectedMediaObjects = [], collectedLinks = []) {
            const textUrls = extractUrlsFromText(textContent);
            const imageSet = new Set();
            const linkSet = new Set();

            (collectedMediaObjects || []).forEach(m => {
                if (!m || !m.url) return;
                const u = String(m.url).trim();
                if (!u) return;
                if (m.type === 'image' || isImageUrl(u)) {
                    imageSet.add(u);
                } else if (u.startsWith('http://') || u.startsWith('https://')) {
                    linkSet.add(u);
                }
            });

            (collectedLinks || []).forEach(l => {
                if (!l) return;
                const u = String(l).trim();
                if (!u) return;
                if (isImageUrl(u)) {
                    imageSet.add(u);
                } else if (u.startsWith('http://') || u.startsWith('https://')) {
                    linkSet.add(u);
                }
            });

            textUrls.forEach(u => {
                const cleanUrl = String(u).trim();
                if (!cleanUrl) return;
                if (isImageUrl(cleanUrl)) {
                    imageSet.add(cleanUrl);
                } else {
                    linkSet.add(cleanUrl);
                }
            });

            const imagesArray = [...imageSet];
            const linksArray = [...linkSet];

            return {
                link_url: linksArray.length > 0 ? JSON.stringify(linksArray) : null,
                image_url: imagesArray.length > 0 ? JSON.stringify(imagesArray) : null,
                linksArray,
                imagesArray
            };
        }

        async function getOrCreateArchiveId(archiveName) {
            if (archiveIdMap[archiveName]) {
                return archiveIdMap[archiveName];
            }
            try {
                const { data: existing, error: selErr } = await supabaseClient
                    .from('archives')
                    .select('id, Archive_name, is_deleted')
                    .eq('Archive_name', archiveName)
                    .eq('is_deleted', false)
                    .limit(1);

                if (!selErr && existing && existing.length > 0) {
                    archiveIdMap[archiveName] = existing[0].id;
                    return existing[0].id;
                }

                const t = themes[archiveName] || themes['Memo'];
                const defaultFolders = archiveName === 'Memo' ? memoFolders : (hobbyFolders[archiveName] || []);
                const { data: inserted, error: insErr } = await supabaseClient
                    .from('archives')
                    .insert([{
                        Archive_name: archiveName,
                        bg_color: t ? t.bg : '#F7F4EE',
                        accent_color: t ? t.accent : '#3B6E8C',
                        folders: defaultFolders,
                        sort_order: archiveName === 'Memo' ? -1 : archiveOrder.indexOf(archiveName),
                        is_deleted: false
                    }])
                    .select()
                    .single();

                if (!insErr && inserted) {
                    archiveIdMap[archiveName] = inserted.id;
                    return inserted.id;
                }
            } catch (err) {
                console.error('아카이브 ID 조회/생성 오류:', err);
            }
            return null;
        }

        async function syncArchivesFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('archives')
                    .select('*')
                    .eq('is_deleted', false)
                    .order('sort_order', { ascending: true })
                    .order('id', { ascending: true });

                if (error) {
                    console.error('archives 조회 오류:', error);
                    return;
                }

                archiveIdMap = {};
                const dbNames = [];

                (data || []).forEach(row => {
                    const name = row.Archive_name;
                    if (!name) return;
                    archiveIdMap[name] = row.id;

                    const rowFolders = parseJsonArraySafe(row.folders, null);

                    if (name === 'Memo') {
                        if (Array.isArray(rowFolders)) {
                            memoFolders = rowFolders;
                        }
                    } else {
                        dbNames.push(name);
                        if (!themes[name]) {
                            themes[name] = {
                                bg: row.bg_color || '#1E293B',
                                card: 'rgba(255,255,255,0.08)',
                                accent: row.accent_color || '#38BDF8',
                                text: '#FFFFFF',
                                sub: 'rgba(255,255,255,0.15)'
                            };
                        } else {
                            if (row.bg_color) themes[name].bg = row.bg_color;
                            if (row.accent_color) themes[name].accent = row.accent_color;
                        }
                        if (Array.isArray(rowFolders)) {
                            hobbyFolders[name] = rowFolders;
                        } else if (!hobbyFolders[name]) {
                            hobbyFolders[name] = [];
                        }
                    }
                });

                Object.keys(themes).forEach(k => {
                    if (k !== 'Memo' && !archiveIdMap[k]) {
                        delete themes[k];
                        delete hobbyFolders[k];
                    }
                });

                archiveOrder = dbNames.filter(n => themes[n]);
                safeLocalStorageSet('themes', JSON.stringify(themes));
                safeLocalStorageSet('memoFolders', JSON.stringify(memoFolders));
                safeLocalStorageSet('hobbyFolders', JSON.stringify(hobbyFolders));
                safeLocalStorageSet('archiveOrder', JSON.stringify(archiveOrder));

                if (!archiveIdMap['Memo']) {
                    await getOrCreateArchiveId('Memo');
                }

                if (currentTab !== 'Memo' && !archiveIdMap[currentTab]) {
                    currentTab = 'Memo';
                    setTheme('Memo');
                }
            } catch (err) {
                console.error('Supabase 아카이브 동기화 예외:', err);
            }
        }

        function mapMemoRowToUiItem(row, reverseArchiveMap, existingUiMap = {}) {
            const archName = reverseArchiveMap[row.archive_id] || 'Memo';
            const dbLinks = parseStoredMediaField(row.link_url);
            const dbImages = parseStoredMediaField(row.image_url);
            const prevItem = existingUiMap[String(row.id)];

            const finalImages = dbImages.length > 0
                ? dbImages
                : (prevItem && Array.isArray(prevItem.images) ? [...new Set(prevItem.images)] : []);

            const finalLinks = dbLinks.length > 0
                ? dbLinks
                : (prevItem && Array.isArray(prevItem.links) ? [...new Set(prevItem.links)] : []);

            const createdIso = row.created_at || (prevItem && prevItem.created_at) || new Date().toISOString();
            const createdDate = String(createdIso).slice(0, 10);

            const resolvedFolder = (row.folder !== undefined && row.folder !== null && row.folder !== '')
                ? row.folder
                : (prevItem && prevItem.folder ? prevItem.folder : '미분류');

            const resolvedType = (row.type !== undefined && row.type !== null && row.type !== '')
                ? row.type
                : (prevItem && prevItem.type ? prevItem.type : 'note');

            const resolvedFavorite = (typeof row.favorite === 'boolean')
                ? row.favorite
                : (prevItem ? !!prevItem.favorite : false);

            const resolvedPinned = (typeof row.pinned === 'boolean')
                ? row.pinned
                : (prevItem ? !!prevItem.pinned : false);

            const resolvedPassword = (row.password !== undefined && row.password !== null)
                ? String(row.password)
                : (prevItem && prevItem.password ? prevItem.password : '');

            const parsedCheckItems = parseJsonArraySafe(row.check_items, null);
            const resolvedCheckItems = Array.isArray(parsedCheckItems) && parsedCheckItems.length > 0
                ? parsedCheckItems
                : (prevItem && Array.isArray(prevItem.checkItems) ? prevItem.checkItems : (resolvedType === 'checklist' ? [] : undefined));

            return {
                id: row.id,
                archive_id: row.archive_id,
                page: archName,
                type: resolvedType,
                folder: resolvedFolder,
                title: row.title || '',
                content: row.content || '',
                thought: row.content || '',
                mediaObjects: finalImages.map(url => ({ url, type: 'image' })),
                images: finalImages,
                links: finalLinks,
                link_url: row.link_url || null,
                image_url: row.image_url || null,
                date: createdDate,
                created_at: createdIso,
                favorite: resolvedFavorite,
                pinned: resolvedPinned,
                password: resolvedPassword,
                checkItems: resolvedCheckItems,
                is_deleted: !!row.is_deleted
            };
        }

        async function syncMemosFromSupabase() {
            try {
                const { data, error } = await supabaseClient
                    .from('memos')
                    .select('*')
                    .eq('is_deleted', false)
                    .order('pinned', { ascending: false })
                    .order('created_at', { ascending: false })
                    .order('id', { ascending: false });

                if (error) {
                    console.error('memos 조회 오류:', error);
                    return;
                }

                const existingMap = {};
                [...memos, ...hobbyPosts].forEach(it => {
                    if (it && it.id !== undefined) {
                        existingMap[String(it.id)] = it;
                    }
                });

                const reverseMap = {};
                Object.entries(archiveIdMap).forEach(([name, id]) => {
                    reverseMap[id] = name;
                });

                const memoArchId = archiveIdMap['Memo'];
                const loadedMemos = [];
                const loadedHobby = [];

                (data || []).forEach(row => {
                    const uiItem = mapMemoRowToUiItem(row, reverseMap, existingMap);
                    if (!row.archive_id || row.archive_id === memoArchId || uiItem.page === 'Memo') {
                        loadedMemos.push(uiItem);
                    } else {
                        loadedHobby.push(uiItem);
                    }
                });

                loadedMemos.sort(compareLatestFirst);
                loadedHobby.sort(compareLatestFirst);

                memos = loadedMemos;
                hobbyPosts = loadedHobby;
                safeLocalStorageSet('memos', JSON.stringify(memos));
                safeLocalStorageSet('hobbyPosts', JSON.stringify(hobbyPosts));
            } catch (err) {
                console.error('Supabase 메모 동기화 예외:', err);
            }
        }

        function initSortableList(container, itemSelector, onOrderUpdated) {
            let draggedItem = null;

            container.querySelectorAll(itemSelector).forEach(item => {
                const handle = item.querySelector('.drag-handle');
                if (!handle) return;

                handle.addEventListener('mousedown', () => {
                    draggedItem = item;
                    item.setAttribute('draggable', 'true');
                });

                handle.addEventListener('mouseup', () => {
                    item.removeAttribute('draggable');
                    draggedItem = null;
                });

                item.addEventListener('dragstart', (e) => {
                    if (!draggedItem) {
                        e.preventDefault();
                        return;
                    }
                    setTimeout(() => item.classList.add('dragging'), 0);
                });

                item.addEventListener('dragend', () => {
                    if (draggedItem) {
                        draggedItem.classList.remove('dragging');
                        draggedItem.removeAttribute('draggable');
                        draggedItem = null;
                        if (onOrderUpdated) onOrderUpdated();
                    }
                });

                handle.addEventListener('touchstart', (e) => {
                    e.stopPropagation();
                    draggedItem = item;
                    item.classList.add('dragging');
                }, { passive: true });

                handle.addEventListener('touchmove', (e) => {
                    if (!draggedItem) return;
                    e.preventDefault();
                    const touchY = e.touches[0].clientY;
                    
                    const containerRect = container.getBoundingClientRect();
                    if (touchY < containerRect.top || touchY > containerRect.bottom) return;

                    const afterElement = getDragAfterElement(container, itemSelector, touchY);
                    if (afterElement == null) {
                        container.appendChild(draggedItem);
                    } else {
                        container.insertBefore(draggedItem, afterElement);
                    }
                }, { passive: false });

                handle.addEventListener('touchend', () => {
                    if (draggedItem) {
                        draggedItem.classList.remove('dragging');
                        draggedItem = null;
                        if (onOrderUpdated) onOrderUpdated();
                    }
                });
            });

            container.addEventListener('dragover', (e) => {
                e.preventDefault();
                if (!draggedItem) return;
                
                const containerRect = container.getBoundingClientRect();
                if (e.clientY < containerRect.top || e.clientY > containerRect.bottom) return;

                const afterElement = getDragAfterElement(container, itemSelector, e.clientY);
                if (afterElement == null) {
                    container.appendChild(draggedItem);
                } else {
                    container.insertBefore(draggedItem, afterElement);
                }
            });
        }

        function getDragAfterElement(container, selector, y) {
            const draggableElements = [...container.querySelectorAll(`${selector}:not(.dragging)`)];
            return draggableElements.reduce((closest, child) => {
                const box = child.getBoundingClientRect();
                const offset = y - box.top - box.height / 2;
                if (offset < 0 && offset > closest.offset) {
                    return { offset: offset, element: child };
                } else {
                    return closest;
                }
            }, { offset: Number.NEGATIVE_INFINITY }).element;
        }

        function positionDropdownNearTrigger(menu, triggerEl, estimatedHeight) {
            if (!menu || !triggerEl) return;
            const rect = triggerEl.getBoundingClientRect();
            const menuWidth = 144;
            let topPos = rect.bottom + 4;
            if (topPos + estimatedHeight > window.innerHeight - 10) {
                topPos = Math.max(10, rect.top - estimatedHeight - 4);
            }
            let leftPos = rect.right - menuWidth;
            if (leftPos < 10) leftPos = 10;
            if (leftPos + menuWidth > window.innerWidth - 10) {
                leftPos = Math.max(10, window.innerWidth - menuWidth - 10);
            }
            menu.style.top = topPos + 'px';
            menu.style.left = leftPos + 'px';
            menu.style.right = 'auto';
        }

                        .from('memos')
                        .update({ is_deleted: true })
                        .eq('archive_id', targetArchId);
                } else {
                    await supabaseClient
                        .from('archives')
                        .update({ is_deleted: true })
                        .eq('Archive_name', name);
                }
                delete archiveIdMap[name];
            } catch (err) {

        async function savePageSetting() {
            const pageName = document.getElementById('targetPageKey').value;
            const rows = document.querySelectorAll('.session-row-item');
            let newFolders = [];
            let folderMapping = {};
            let removedFolders = [];

            const prevFolders = (pageName === 'Memo') ? [...memoFolders] : [...(hobbyFolders[pageName] || [])];

            for (let row of rows) {
                let oldName = row.dataset.oldName;
                let inputVal = row.querySelector('.sess-name-input').value.trim();
                if (!inputVal) continue;
                if (newFolders.includes(inputVal)) {
                    alert(`세션 이름이 중복됩니다: ${inputVal}`);
                    return;
                }
                newFolders.push(inputVal);
                if (oldName) folderMapping[oldName] = inputVal;
            }

            prevFolders.forEach(oldF => {
                if (!folderMapping[oldF]) {
                    removedFolders.push(oldF);
                }
            });

            if (pageName === 'Memo') {
                const memoArchId = await getOrCreateArchiveId('Memo');
                if (memoArchId) {
                    const { error } = await supabaseClient
                        .from('archives')
                        .update({ folders: newFolders })
                        .eq('id', memoArchId);
                    if (error) console.error('Memo 세션 DB 저장 오류:', error);
                }

                for (const [oldF, newF] of Object.entries(folderMapping)) {
                    if (oldF !== newF && memoArchId) {
                        await supabaseClient
                            .from('memos')
                            .update({ folder: newF })
                            .eq('archive_id', memoArchId)
                            .eq('folder', oldF);
                    }
                }
                for (const remF of removedFolders) {
                    if (memoArchId) {
                        await supabaseClient
                            .from('memos')
                            .update({ folder: '미분류' })
                            .eq('archive_id', memoArchId)
                            .eq('folder', remF);
                    }
                }

                memoFolders = newFolders;
                safeLocalStorageSet('memoFolders', JSON.stringify(memoFolders));
                memos.forEach(m => {
                    if (folderMapping[m.folder]) m.folder = folderMapping[m.folder];
                    else if (removedFolders.includes(m.folder)) m.folder = '미분류';
                });
                safeLocalStorageSet('memos', JSON.stringify(memos));
            } else {
                const newName = document.getElementById('editPageName').value.trim();
                const newBg = document.getElementById('editPageBg').value;
                const newAccent = document.getElementById('editPageAccent').value;

                if(!newName) return alert('아카이브 이름을 입력해 주세요.');
                if(pageName !== newName && themes[newName]) return alert('이미 존재하는 이름입니다.');

                const archId = archiveIdMap[pageName];
                if (archId) {
                    const { error } = await supabaseClient
                        .from('archives')
                        .update({
                            Archive_name: newName,
                            bg_color: newBg,
                            accent_color: newAccent,
                            folders: newFolders
                        })
                        .eq('id', archId);
                    if (error) {
                        console.error('아카이브 수정 오류:', error);
                    }

                    for (const [oldF, newF] of Object.entries(folderMapping)) {
                        if (oldF !== newF) {
                            await supabaseClient
                                .from('memos')
                                .update({ folder: newF })
                                .eq('archive_id', archId)
                                .eq('folder', oldF);
                        }
                    }
                    for (const remF of removedFolders) {
                        await supabaseClient
                            .from('memos')
                            .update({ folder: '미분류' })
                            .eq('archive_id', archId)
                            .eq('folder', remF);
                    }
                }

                hobbyFolders[pageName] = newFolders;
                hobbyPosts.forEach(p => {
                    if (p.page === pageName) {
                        if (folderMapping[p.folder]) p.folder = folderMapping[p.folder];
                        else if (removedFolders.includes(p.folder)) p.folder = '미분류';
                    }
                });

                if(pageName !== newName) {
                    themes[newName] = themes[pageName];
                    delete themes[pageName];
                    hobbyFolders[newName] = hobbyFolders[pageName] || [];
                    delete hobbyFolders[pageName];
                    hobbyPosts.forEach(p => { if(p.page === pageName) p.page = newName; });
                    if (archiveIdMap[pageName]) {
                        archiveIdMap[newName] = archiveIdMap[pageName];
                        delete archiveIdMap[pageName];
                    }
                    
                    const idx = archiveOrder.indexOf(pageName);
                    if (idx !== -1) archiveOrder[idx] = newName;
                    safeLocalStorageSet('archiveOrder', JSON.stringify(archiveOrder));
                }

                themes[newName].bg = newBg;
                themes[newName].accent = newAccent;
                safeLocalStorageSet('themes', JSON.stringify(themes));
                safeLocalStorageSet('hobbyFolders', JSON.stringify(hobbyFolders));
                safeLocalStorageSet('hobbyPosts', JSON.stringify(hobbyPosts));
                if(currentTab === pageName) currentTab = newName;

            if (currentSession !== '전체' && currentSession !== '즐겨찾기' && currentSession !== '미분류') {

                    currentSession = folderMapping[currentSession];

                    currentSession = '전체';
                }
            }

            toggleSettingModal(false);
            renderSidebar();
            setTheme(currentTab);
            await syncMemosFromSupabase();
            render();
        }

        function addMediaInputRow(val = '', isExistingData = false, fileType = 'image') {
            const container = document.getElementById('mediaInputsContainer');
            const row = document.createElement('div');
            row.className = 'media-input-row';
            const uniqueId = 'file-' + Date.now() + '-' + Math.floor(Math.random() * 10000);
            const hasContent = !!(val && String(val).trim() !== '');

            let displayVal = val || '';
            let lockedAttr = '';
            let lockedClass = '';
            if (isExistingData && (String(val).startsWith('data:') || String(val).startsWith('blob:') || String(val).startsWith('file:'))) {
                displayVal = '첨부된 미디어 파일';
                lockedAttr = 'readonly';
                lockedClass = 'locked';
                row.dataset.existingData = val;
                row.dataset.fileType = fileType || 'image';
            } else if (hasContent) {
                row.dataset.fileType = fileType || (isImageUrl(val) ? 'image' : 'link');
            }

            row.innerHTML = `
                <div class="unified-input-box ${lockedClass}">
                    <input type="text" class="modal-media-url" placeholder="사진/움짤 파일 선택 또는 링크(URL)" value="${displayVal}" ${lockedAttr} style="margin-bottom:0;">
                    <label for="${uniqueId}" class="file-select-label">파일 선택</label>
                    <input type="file" id="${uniqueId}" class="modal-media-file" accept="image/*,.gif" style="display: none;" onchange="handleFileSelect(this)">
                </div>
                <button type="button" class="remove-row-btn" style="display: ${hasContent ? 'inline-block' : 'none'};" onclick="removeMediaRow(this)">삭제</button>
            `;
            container.appendChild(row);
        }

        function readFileAsDataUrl(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    resolve(evt.target.result || '');
                };
                reader.onerror = function(err) {
                    reject(err);
                };
                reader.readAsDataURL(file);
            });
        }

        async function handleFileSelect(input) {
            const row = input.closest('.media-input-row');
            const box = row.querySelector('.unified-input-box');
            const textInput = row.querySelector('.modal-media-url');
            const removeBtn = row.querySelector('.remove-row-btn');

            if (input.files && input.files[0]) {
                const file = input.files[0];
                try {
                    const dataUrl = await readFileAsDataUrl(file);
                    row.dataset.existingData = dataUrl;
                    row.dataset.fileType = 'image';
                } catch (_) {
                    row.dataset.existingData = URL.createObjectURL(file);
                    row.dataset.fileType = 'image';
                }

                textInput.value = file.name;
                textInput.readOnly = true;
                box.classList.add('locked');
                removeBtn.style.display = 'inline-block';

                const rows = document.querySelectorAll('.media-input-row');
                if (rows[rows.length - 1] === row) {
                    addMediaInputRow();
                }
            }
        }

        document.addEventListener('input', function(e) {
            if (e.target.classList.contains('modal-media-url') && !e.target.readOnly) {
                const row = e.target.closest('.media-input-row');
                const removeBtn = row.querySelector('.remove-row-btn');
                const val = e.target.value.trim();
                const hasText = val !== '';
                removeBtn.style.display = hasText ? 'inline-block' : 'none';

                if (isImageUrl(val)) {
                    row.dataset.fileType = 'image';
                } else if (val.startsWith('http://') || val.startsWith('https://')) {
                    row.dataset.fileType = 'link';
                } else {
                    row.dataset.fileType = 'image';
                }

                const container = document.getElementById('mediaInputsContainer');
                const rows = container.querySelectorAll('.media-input-row');
                if (rows[rows.length - 1] === row && hasText) {
                    addMediaInputRow();
                }
            }
        });

        function removeMediaRow(btn) {
            const row = btn.closest('.media-input-row');
            const container = document.getElementById('mediaInputsContainer');
            const rows = container.querySelectorAll('.media-input-row');

            if (rows.length > 1) {
                row.remove();
            } else {
                const box = row.querySelector('.unified-input-box');
                const textInput = row.querySelector('.modal-media-url');
                const fileInput = row.querySelector('.modal-media-file');
                textInput.value = '';
                textInput.readOnly = false;
                box.classList.remove('locked');
                delete row.dataset.existingData;
                delete row.dataset.fileType;
                if (fileInput) fileInput.value = '';
                btn.style.display = 'none';
            }

            const updatedRows = container.querySelectorAll('.media-input-row');
            const lastRow = updatedRows[updatedRows.length - 1];
            const lastText = lastRow.querySelector('.modal-media-url').value.trim();
            if (lastText !== '') {
                addMediaInputRow();
            }
        }

        async function savePost() {
            const editId = document.getElementById('editTargetId').value;
            const folder = document.getElementById('modalFolder').value || '미분류';
            const title = document.getElementById('modalTitle').value.trim();
            const content = document.getElementById('modalContent').value.trim();
            
            if(!title && !content) {
                alert('제목이나 내용 중 최소한 하나는 입력해 주세요.');
                return;
            }

            const rows = Array.from(document.querySelectorAll('.media-input-row'));
            const rawMediaInputs = [];
            const rawLinkInputs = [];
            const seenRowKeys = new Set();

            for (let row of rows) {
                const fileInput = row.querySelector('.modal-media-file');
                const textInput = row.querySelector('.modal-media-url');
                let urlVal = '';
                let fType = row.dataset.fileType || 'image';

                if (row.dataset.existingData) {
                    urlVal = row.dataset.existingData;
                } else if (fileInput && fileInput.files && fileInput.files[0]) {
                    try {
                        urlVal = await readFileAsDataUrl(fileInput.files[0]);
                        fType = 'image';
                    } catch (_) {
                        urlVal = URL.createObjectURL(fileInput.files[0]);
                        fType = 'image';
                    }
                } else if (textInput) {
                    urlVal = textInput.value.trim();
                }

                if (!urlVal) continue;
                if (seenRowKeys.has(urlVal)) continue;
                seenRowKeys.add(urlVal);

                if (fType === 'image' || isImageUrl(urlVal)) {
                    rawMediaInputs.push({ url: urlVal, type: 'image' });
                } else if (urlVal.startsWith('http://') || urlVal.startsWith('https://')) {
                    rawLinkInputs.push(urlVal);
                } else {
                    rawMediaInputs.push({ url: urlVal, type: fType });
                }
            }

            const classified = classifyLinksAndImages(content, rawMediaInputs, rawLinkInputs);
            const collectedMediaObjects = classified.imagesArray.map(url => ({ url, type: 'image' }));
            const collectedLinks = classified.linksArray;
            const archiveId = await getOrCreateArchiveId(currentTab);
            const nowIso = new Date().toISOString();

            let savedRowData = null;

            try {
                if (editId) {
                    const { data, error } = await supabaseClient
                        .from('memos')
                        .update({
                            archive_id: archiveId,
                            folder: folder,
                            type: 'note',
                            title: title,
                            content: content,
                            link_url: classified.link_url,
                            image_url: classified.image_url
                        })
                        .eq('id', editId)
                        .select()
                        .single();

                    if (error) {
                        console.error('메모 수정 오류:', error);
                        alert('Supabase 메모 수정에 실패했습니다: ' + error.message);
                        return;
                    }
                    savedRowData = data;
                } else {
                    const { data, error } = await supabaseClient
                        .from('memos')
                        .insert([{
                            archive_id: archiveId,
                            folder: folder,
                            type: 'note',
                            title: title,
                            content: content,
                            favorite: false,
                            pinned: false,
                            password: '',
                            created_at: nowIso,
                            link_url: classified.link_url,
                            image_url: classified.image_url,
                            is_deleted: false
                        }])
                        .select()
                        .single();

                    if (error) {
                        console.error('메모 저장 오류:', error);
                        alert('Supabase 메모 저장에 실패했습니다: ' + error.message);
                        return;
                    }
                    savedRowData = data;
                }
            } catch (err) {
                console.error('메모 저장 예외:', err);
                alert('메모 저장 중 오류가 발생했습니다.');
                return;
            }

            const finalId = savedRowData && savedRowData.id ? savedRowData.id : (editId || Date.now());
            const finalCreatedAt = (savedRowData && savedRowData.created_at) || nowIso;
            const finalDate = String(finalCreatedAt).slice(0, 10);

            const newOrUpdatedItem = {
                id: finalId,
                archive_id: archiveId,
                page: currentTab,
                type: 'note',
                folder,
                title,
                content,
                thought: content,
                mediaObjects: collectedMediaObjects,
                images: classified.imagesArray,
                links: collectedLinks,
                link_url: classified.link_url,
                image_url: classified.image_url,
                date: finalDate,
                created_at: finalCreatedAt,
                favorite: false,
                pinned: false,
                password: '',
                is_deleted: false
            };

            if (currentTab === 'Memo') {
                if (editId) {
                    const idx = memos.findIndex(m => m.id == editId || m.id == finalId);
                    if (idx !== -1) {
                        newOrUpdatedItem.favorite = !!memos[idx].favorite;
                        newOrUpdatedItem.pinned = !!memos[idx].pinned;
                        newOrUpdatedItem.password = memos[idx].password || '';
                        newOrUpdatedItem.created_at = memos[idx].created_at || finalCreatedAt;
                        memos[idx] = newOrUpdatedItem;
                    } else {
                        memos.unshift(newOrUpdatedItem);
                    }
                } else {
                    memos = memos.filter(m => m.id != finalId);
                    memos.unshift(newOrUpdatedItem);
                }
                memos.sort(compareLatestFirst);
                safeLocalStorageSet('memos', JSON.stringify(memos));
            } else {
                if (editId) {
                    const idx = hobbyPosts.findIndex(p => p.id == editId || p.id == finalId);
                    if (idx !== -1) {
                        newOrUpdatedItem.favorite = !!hobbyPosts[idx].favorite;
                        newOrUpdatedItem.pinned = !!hobbyPosts[idx].pinned;
                        newOrUpdatedItem.password = hobbyPosts[idx].password || '';
                        newOrUpdatedItem.created_at = hobbyPosts[idx].created_at || finalCreatedAt;
                        hobbyPosts[idx] = newOrUpdatedItem;
                    } else {
                        hobbyPosts.unshift(newOrUpdatedItem);
                    }
                } else {
                    hobbyPosts = hobbyPosts.filter(p => p.id != finalId);
                    hobbyPosts.unshift(newOrUpdatedItem);
                }
                hobbyPosts.sort(compareLatestFirst);
                safeLocalStorageSet('hobbyPosts', JSON.stringify(hobbyPosts));
            }

            toggleModal(false);
            await syncMemosFromSupabase();
            render();
        }

        async function submitPasswordModal() {
            const val = document.getElementById('pwInput').value.trim();
            const action = document.getElementById('pwActionType').value;
            const id = document.getElementById('pwTargetId').value;

            if (val.length !== 4) {
                alert('비밀번호는 정확히 4자리여야 합니다.');
                return;
            }

            let targetList = (currentTab === 'Memo') ? memos : hobbyPosts;
            let target = targetList.find(i => i.id == id);
            if (!target) return;

            if (action === 'unlock') {
                if (target.password === val) {
                    togglePasswordModal(false);
                    viewingDetailId = id;
                    render();
                } else {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else if (action === 'unlock_clear') {
                if (target.password === val) {
                    const ok = await updatePasswordInSupabase(id, '');
                    if (!ok) return;
                    target.password = '';
                    saveCurrentListStorage();
                    togglePasswordModal(false);
                    alert('잠금이 해제되었습니다.');
                    render();
                } else {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else if (action === 'edit') {
                if (target.password === val) {
                    togglePasswordModal(false);
                    openEditModalForItem(target);
                } else {
                    alert('비밀번호가 틀렸습니다.');
                }
            } else if (action === 'setlock') {
                const ok = await updatePasswordInSupabase(id, val);
                if (!ok) return;
                target.password = val;
                saveCurrentListStorage();
                togglePasswordModal(false);
                alert('비밀번호가 설정되었습니다.');
                render();
            }
        }

        function getItemImages(item) {
            if (!item) return [];
            const list = [];
            if (Array.isArray(item.images)) {
                item.images.forEach(u => {
                    if (u && String(u).trim()) list.push(String(u).trim());
                });
            }
            if (Array.isArray(item.mediaObjects)) {
                item.mediaObjects.forEach(m => {
                    if (m && m.url && String(m.url).trim()) list.push(String(m.url).trim());
                });
            }
            if (item.image_url) {
                parseStoredMediaField(item.image_url).forEach(u => {
                    if (u && String(u).trim()) list.push(String(u).trim());
                });
            }
            return [...new Set(list)];
        }

        function getItemLinks(item) {
            if (!item) return [];
            const list = [];
            if (Array.isArray(item.links)) {
                item.links.forEach(u => {
                    if (u && String(u).trim()) list.push(String(u).trim());
                });
            }
            if (item.link_url) {
                parseStoredMediaField(item.link_url).forEach(u => {
                    if (u && String(u).trim()) list.push(String(u).trim());
                });
            }
            return [...new Set(list)];
        }

        function hasPhotoAttached(item) {
            return getItemImages(item).length > 0;
        }

        function hasLinkAttached(item) {
            if (getItemLinks(item).length > 0) return true;
            const combinedText = `${item.title || ''} ${item.content || ''} ${item.thought || ''}`;
            return /https?:\/\//i.test(combinedText);
        }

        function matchesSearchQuery(item, q) {
            if (!q) return true;
            const isLocked = !!(item.password && item.password.length === 4);
            const titleLower = (item.title || '').toLowerCase();
            const bodyLower = `${item.content || ''} ${item.thought || ''}`.toLowerCase();

            if (isLocked) {
                return titleLower.includes(q);
            }

            if (q === '#사진') {
                return titleLower.includes('#사진') || bodyLower.includes('#사진') || hasPhotoAttached(item);
            }

            if (q === '#링크') {
                return titleLower.includes('#링크') || bodyLower.includes('#링크') || hasLinkAttached(item);
            }

            return titleLower.includes(q) || bodyLower.includes(q);
        }

        function getFilteredDataSource() {
            let dataSource = (currentTab === 'Memo') ? memos : hobbyPosts.filter(p => p.page === currentTab);
            dataSource = dataSource.filter(item => !item.is_deleted);

            if (currentSession === '즐겨찾기') {
                dataSource = dataSource.filter(item => item.favorite);
            } else if (currentSession !== '전체') {
                dataSource = dataSource.filter(item => (item.folder || '미분류') === currentSession);
            }

            if (searchQuery) {
                dataSource = dataSource.filter(item => matchesSearchQuery(item, searchQuery));
            }

            dataSource.sort(compareLatestFirst);
            return dataSource;
        }

            let allSelected = currentDataSourceIds.length > 0 && currentDataSourceIds.every(id => selectedItemIds.has(id));

            let batchBarHtml = `
                <div class="batch-delete-bar ${isBatchMode ? 'show' : ''}" id="batchDeleteBar">
                    <div style="display:flex; align-items:center; gap:8px;">
                        <span style="font-size:0.9rem; font-weight:bold;">총 <span id="selectedCount">${selectedItemIds.size}</span>개 선택됨</span>
                    </div>
                    <div style="display:flex; gap:6px;">
                        <button type="button" class="btn" style="background:#555; padding:6px 12px; font-size:0.85rem; min-height:auto; white-space:nowrap;" onclick='toggleSelectAll(${JSON.stringify(currentDataSourceIds)})'>${allSelected ? '전체 해제' : '전체 선택'}</button>
                        <button type="button" class="btn" style="background:#d9534f; padding:6px 12px; font-size:0.85rem; min-height:auto; white-space:nowrap;" onclick="deleteSelectedItems()">선택 삭제</button>
                        <button type="button" class="btn" style="background:#888; padding:6px 12px; font-size:0.85rem; min-height:auto; white-space:nowrap;" onclick="toggleBatchMode()">취소</button>
                    </div>
                </div>
            `;

            let cards = buildCardsHtml(dataSource);

            main.innerHTML = `
                <div class="header-bar">
                    <h1>${pageTitle}</h1>
                    <div class="search-container">
                        <div class="search-input-box ${searchQuery ? 'open' : ''}" id="searchInputBox">
                            <input type="text" id="searchInput" placeholder="제목/내용 검색..." value="${searchQuery}">
                        </div>
                        <button type="button" class="search-btn" onclick="toggleSearchBox()" title="검색">${SEARCH_ICON_SVG}</button>
                    </div>
                </div>
                ${tabsHtml}
                ${batchBarHtml}
                <div id="cardsListContainer">${cards || '<p>검색 결과가 없거나 작성된 기록이 없습니다.</p>'}</div>
                <button type="button" class="fab" onclick="toggleTypeSelectModal(true)">+</button>
            `;

            bindSearchEvents();

            if (searchQuery) {
                const box = document.getElementById('searchInputBox');
                const input = document.getElementById('searchInput');
                if (box && input) {
                    box.classList.add('open');
                    input.focus();
                    input.setSelectionRange(input.value.length, input.value.length);
                }
            }
        }

        function bindSearchEvents() {
            const input = document.getElementById('searchInput');
            if (!input) return;
            input.addEventListener('compositionstart', () => {
                isComposingSearch = true;
            });
            input.addEventListener('compositionend', (e) => {
                isComposingSearch = false;
                searchQuery = e.target.value.trim().toLowerCase();
                updateFilteredCardsOnly();
            });
            input.addEventListener('input', handleSearchInput);
        }

        renderSidebar();
        render();
        initSupabaseApp();
    </script>
</body>
</html>
